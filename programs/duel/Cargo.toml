[package]
name = "duel"
version = "0.1.0"
description = "Stock-vs-stock duels: tokenized shares in escrow, settled by Pyth prices"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "duel"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
